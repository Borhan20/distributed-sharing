[project]
name = "pool-dev"
version = "0.0.0"
description = "Development workspace for the pool group compute platform (not a package)"
requires-python = ">=3.12"
dependencies = ["pool-protocol", "pool-cp", "pool-cli"]

[tool.uv.sources]
pool-protocol = { workspace = true }
pool-cp = { workspace = true }
pool-cli = { workspace = true }

[tool.uv.workspace]
members = ["protocol", "control-plane", "cli"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "websockets>=13",
  "ruff>=0.6",
  "pyyaml>=6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "e2e: end-to-end tests that start the control plane and real agents (need Docker and Go)",
  "docker: tests that need a Docker daemon",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["pool_cp", "pool_protocol", "pool_cli", "pool"]

[tool.ruff.lint.per-file-ignores]
# Tests and dev scripts start processes and build SQL from constant fragments.
"**/tests/**" = ["S603", "S607", "S608", "S108", "B017", "S105", "S106"]
"tests/**" = ["S603", "S607", "S608", "S108", "B017", "S105", "S106"]
"**/migrations/versions/*" = ["E501"]  # autogenerated by Alembic
