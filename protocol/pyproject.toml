[project]
name = "pool-protocol"
version = "0.1.0"
description = "Agent protocol v1alpha1 and job specification models for pool"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pool_protocol"]
