[project]
name = "pool-cli"
version = "0.1.0"
description = "pool CLI (`pool submit job.yaml`) and Python SDK (checkpoint helpers)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pool-protocol",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.scripts]
pool = "pool_cli.main:main"

[tool.uv.sources]
pool-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pool_cli", "pool"]
