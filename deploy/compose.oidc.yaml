# Shared-server mode: real OIDC login through Keycloak (plan §8.6). Dev login is off.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.oidc.yaml up -d --build
#
# Keycloak runs in start-dev mode here for evaluation only. For production follow
# Keycloak's production guide (TLS, its own database) or point POOL_OIDC_* at your
# organization's identity provider instead.

services:
  api:
    environment:
      POOL_DEV_MODE: "false"
      POOL_OIDC_ISSUER: ${POOL_OIDC_ISSUER:-http://127.0.0.1:8080/realms/pool}
      POOL_OIDC_AUDIENCE: ${POOL_OIDC_AUDIENCE:-pool-api}
      POOL_OIDC_JWKS_URL: ${POOL_OIDC_JWKS_URL:-http://keycloak:8080/realms/pool/protocol/openid-connect/certs}
      POOL_REQUIRE_MFA_FOR_ADMINS: ${POOL_REQUIRE_MFA_FOR_ADMINS:-true}
  scheduler:
    environment:
      POOL_DEV_MODE: "false"
      POOL_OIDC_ISSUER: ${POOL_OIDC_ISSUER:-http://127.0.0.1:8080/realms/pool}
      POOL_OIDC_AUDIENCE: ${POOL_OIDC_AUDIENCE:-pool-api}
  migrate:
    environment:
      POOL_DEV_MODE: "false"
      POOL_OIDC_ISSUER: ${POOL_OIDC_ISSUER:-http://127.0.0.1:8080/realms/pool}
      POOL_OIDC_AUDIENCE: ${POOL_OIDC_AUDIENCE:-pool-api}
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG:-26.0}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in deploy/.env}
    volumes: ["./keycloak/pool-realm.json:/opt/keycloak/data/import/pool-realm.json:ro"]
    ports: ["${POOL_BIND:-127.0.0.1}:8080:8080"]
