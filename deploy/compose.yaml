# One-server deployment (plan §9 Phase 1).
#
#   cp deploy/.env.example deploy/.env      # then edit it
#   docker compose -f deploy/compose.yaml up -d --build
#
# Default: DEV MODE (built-in dev login, no passwords) for trying pool on one machine.
# For a shared server use OIDC:  docker compose -f deploy/compose.yaml -f deploy/compose.oidc.yaml up -d
# Object store (SeaweedFS, S3 API):  add  --profile storage  and set POOL_S3_* in deploy/.env

name: pool

x-cp: &cp
  image: pool-control-plane:dev
  build: { context: .., dockerfile: deploy/Dockerfile }
  restart: unless-stopped
  environment: &cp-env
    POOL_DATABASE_URL: postgresql+asyncpg://pool:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/pool
    POOL_DEV_MODE: ${POOL_DEV_MODE:-true}
    POOL_PUBLIC_URL: ${POOL_PUBLIC_URL:-http://127.0.0.1:8000}
    POOL_SERVER_ADMINS: ${POOL_SERVER_ADMINS:-[]}
    POOL_S3_ENDPOINT: ${POOL_S3_ENDPOINT:-}
    POOL_S3_PUBLIC_ENDPOINT: ${POOL_S3_PUBLIC_ENDPOINT:-}
    POOL_S3_ACCESS_KEY: ${POOL_S3_ACCESS_KEY:-}
    POOL_S3_SECRET_KEY: ${POOL_S3_SECRET_KEY:-}
    # The built-in registry for `pool run` (docs/design/pool-run.md §3.1): the address members' and
    # computers' Docker use, and how the server reaches it inside compose.
    POOL_REGISTRY_ADDRESS: ${POOL_REGISTRY_ADDRESS:-127.0.0.1:5000}
    POOL_REGISTRY_INTERNAL_URL: http://registry:5000
    # Only the certificate the registry trusts lives in registry-trust; its key stays in pool-keys.
    POOL_REGISTRY_CERT_FILE: /var/lib/pool-registry/registry.crt
    POOL_REGISTRY_RETENTION_DAYS: ${POOL_REGISTRY_RETENTION_DAYS:-30}
  volumes:
    - pool-keys:/var/lib/pool
    - registry-trust:/var/lib/pool-registry
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pool
      POSTGRES_USER: pool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pool -d pool"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *cp
    restart: "no"
    command: ["python", "-m", "pool_cp.migrate"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *cp
    # Keys (CA, envelope signing) live in the pool-keys volume. In dev mode they are created on first start.
    environment:
      <<: *cp-env
      POOL_AUTOCREATE_KEYS: ${POOL_AUTOCREATE_KEYS:-true}
    ports: ["${POOL_BIND:-127.0.0.1}:8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  scheduler:
    <<: *cp
    command: ["python", "-m", "pool_cp.scheduler"]
    depends_on: { api: { condition: service_healthy } }

  registry:
    # CNCF Distribution (Apache-2.0), pinned to the version the e2e tests run (tests/e2e/test_pool_run.py).
    # Token sign-in through the API (/api/v1/registry/token); it trusts the certificate the API creates in
    # the pool-keys volume, so it starts after the API.
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    restart: unless-stopped
    environment:
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: ${POOL_PUBLIC_URL:-http://127.0.0.1:8000}/api/v1/registry/token
      REGISTRY_AUTH_TOKEN_SERVICE: pool-registry
      REGISTRY_AUTH_TOKEN_ISSUER: pool-server
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /var/lib/pool-registry/registry.crt
      REGISTRY_STORAGE_DELETE_ENABLED: "true"  # clean-up of unused images (pool_cp/registry_cleanup.py)
      REGISTRY_HTTP_RELATIVEURLS: "true"       # correct upload addresses behind a proxy (Caddy)
    volumes:
      - registry-data:/var/lib/registry
      - registry-trust:/var/lib/pool-registry:ro  # the certificate only: never the server's keys
    # It is reachable from the internet (through Caddy), so it gets no capabilities and a read-only image.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports: ["${POOL_BIND:-127.0.0.1}:5000:5000"]
    depends_on: { api: { condition: service_healthy } }

  seaweedfs:
    profiles: [storage]
    # Apache-2.0. Pinned to the version the object-store tests ran against (tests/e2e/test_object_store.py).
    image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - seaweed-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["${POOL_BIND:-127.0.0.1}:8333:8333"]

volumes:
  pg-data:
  pool-keys:
  registry-data:
  registry-trust:
  seaweed-data:
