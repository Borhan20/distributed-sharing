[project]
name = "pool-cp"
version = "0.1.0"
description = "pool control plane: FastAPI API server and scheduler worker"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pool-protocol",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "pyyaml>=6",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[tool.uv.sources]
pool-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pool_cp"]
